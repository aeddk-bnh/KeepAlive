version: '3.8'

services:
  keepalive:
    build: .
    ports:
      - "3001:3001"
      - "5173:5173"
      # Expose a range of ports for websockify per target
      - "6080-6090:6080-6090"
    environment:
      - NODE_ENV=development
    volumes:
      - ./packages/database/prisma/dev.db:/app/packages/database/prisma/dev.db
